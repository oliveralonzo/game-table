[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-table"
version = "0.1.0"
description = "Backend infrastructure for pluggable multiplayer table games"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116,<1",
    "PyJWT[crypto]>=2.13,<3",
    "psycopg[binary]>=3.2,<4",
    "python-socketio>=5.13,<6",
]

[tool.setuptools.packages.find]
where = ["src"]
